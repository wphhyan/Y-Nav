<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- 站内图标：内联 SVG，避免为一个 favicon 再跨域握手（应用启动后会被站点设置覆盖） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Ctext x='16' y='23' font-family='system-ui,-apple-system,sans-serif' font-size='18' font-weight='700' fill='%23fff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var shouldDark = mode === 'dark' || (mode === 'system' && prefersDark);
        var root = document.documentElement;
        if (shouldDark) {
          root.classList.add('dark');
          root.style.backgroundColor = '#05070f';
          document.body.style.backgroundColor = '#05070f';
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#f8fafc';
          document.body.style.backgroundColor = '#f8fafc';
        }
      } catch (e) {
        // Ignore and fall back to default styling.
      }
    })();
  </script>
  <title>元启 Y-Nav</title>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
