# ============================================
# Y-Nav Cloudflare Workers 部署配置
# ============================================
# 此配置用于将 Y-Nav 部署为 Cloudflare Worker
# 支持自定义域名 + 优选 IP 实现国内加速
# ============================================

name = "nav"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

# 静态资源 (Cloudflare Static Assets)
# 由边缘直接提供 ./dist 下的文件，命中资源的请求不会调用 Worker。
# not_found_handling = "none"：未命中的路径一律交给 Worker 处理。
#
# 这里**不能**用 "single-page-application"：它会让 /assets/ 下已下线的旧哈希
# （或写错的路径）返回 index.html 且状态码 200，而 public/_headers 给 /assets/*
# 设了 immutable，浏览器会把这个 HTML 缓存一年 —— 站点会"坏掉且刷不回来"。
# SPA 深链接的回退改由 Worker 实现（见 worker/index.ts 的 serveStatic）：
# 只有 GET/HEAD 且 Accept 带 text/html 的导航请求才回退，资源路径老老实实 404。
[assets]
directory = "./dist"
not_found_handling = "none"
binding = "ASSETS"

# KV 命名空间绑定 (Workers 专用，与 Pages 的 YNAV_KV 区分)
# 若需创建新的 KV: wrangler kv:namespace create YNAV_WORKER_KV
[[kv_namespaces]]
binding = "YNAV_WORKER_KV"
id = "8e40f1431c2b4f26858e31d8705f3c88"

# 环境变量 (也可以在 Cloudflare Dashboard 中设置)
[vars]
# SYNC_PASSWORD = ""  # 同步密码，建议在 Dashboard 中设置而非此处

# 生产环境配置 (可选)
# [env.production]
# routes = [
#   { pattern = "your-domain.com/*", zone_name = "your-domain.com" }
# ]

# ============================================
# 部署步骤:
# 1. npm run build
# 2. wrangler kv:namespace create YNAV_WORKER_KV
# 3. 将返回的 id 填入上方 kv_namespaces.id
# 4. wrangler deploy
# ============================================
